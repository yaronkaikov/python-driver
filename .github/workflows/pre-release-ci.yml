name: Pre-release CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Unrelated label events must not cancel an active pre-release run. Removing
  # pre-release-ci cancels it; the label guard below then skips replacement jobs.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action == 'synchronize' ||
         github.event.action == 'reopened' ||
         github.event.label.name == 'pre-release-ci') }}

jobs:
  wheels:
    name: Full wheel builds and tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'pre-release-ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'pre-release-ci') &&
       github.event.action != 'unlabeled')
    uses: ./.github/workflows/lib-build.yml

  integration:
    name: Driver integration tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'pre-release-ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'pre-release-ci') &&
       github.event.action != 'unlabeled')
    uses: ./.github/workflows/integration-tests.yml

  scylla-testpy:
    name: Scylla CQL tests with candidate wheel
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Keep source and relocatable build on the same revision. Use a dev build
      # so CQL tests can exercise error injection as well as normal requests.
      SCYLLA_REVISION: da8d276b4eadb66327e912b46a0530c3e2d1da50
      SCYLLA_EXE_URL: https://s3.amazonaws.com/downloads.scylladb.com/unstable/scylla/master/relocatable/2026-10-31T20:09:31Z/scylla-dev-2027.1.0~dev-0.20261031.da8d276b4ead.x86_64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out matching Scylla tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scylladb/scylladb
          ref: ${{ env.SCYLLA_REVISION }}
          path: scylla-tests
          persist-credentials: false

      - name: Download Linux candidate wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-linux-ubuntu-24.04
          path: candidate-wheels

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: scylla-tests/test/uv.lock

      - name: Install server and driver runtime libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libev4 libnuma1 clang lld wabt binaryen slapd ldap-utils sasl2-bin

      - name: Prepare test.py auxiliary services
        run: |
          mkdir -p "$RUNNER_TEMP/testpy-bin"
          for binary in toxiproxy-cli toxiproxy-server; do
            curl --fail --location --retry 3 \
              "https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/$binary-linux-amd64" \
              -o "$RUNNER_TEMP/testpy-bin/$binary"
            chmod +x "$RUNNER_TEMP/testpy-bin/$binary"
          done
          # A private copy avoids Ubuntu's system slapd AppArmor profile, which
          # denies the temporary config/data directories created by test.py.
          cp /usr/sbin/slapd "$RUNNER_TEMP/testpy-bin/slapd"
          echo "$RUNNER_TEMP/testpy-bin" >> "$GITHUB_PATH"
          # Upstream's LDAP fixture assumes Fedora paths and a built-in MDB
          # backend. Ubuntu ships the same backend as a dynamically loaded module.
          sed -i 's@/etc/openldap/schema/@/etc/ldap/schema/@g' \
            scylla-tests/test/resource/slapd.conf
          sed -i '1i modulepath /usr/lib/ldap\nmoduleload back_mdb' \
            scylla-tests/test/resource/slapd.conf

      - name: Prepare Wasm fixtures for CQL tests
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-wasip1
          bash scripts/build_scylla_wasm.sh "$GITHUB_WORKSPACE/scylla-tests"

      - name: Run Scylla CQL suite
        env:
          SCYLLA_SOURCE: ${{ github.workspace }}/scylla-tests
          DRIVER_WHEEL_DIR: ${{ github.workspace }}/candidate-wheels
          TESTPY_LOG_DIR: ${{ runner.temp }}/scylla-testpy-logs
        run: bash scripts/run_scylla_testpy.sh

      - name: Upload Scylla test reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scylla-testpy-logs
          path: ${{ runner.temp }}/scylla-testpy-logs
          if-no-files-found: warn
